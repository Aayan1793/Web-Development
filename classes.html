<html>
    <head>
        <title>My planet cards</title>
        <style>
            body {
                font-family: Arial;
                padding: 30px;
                text-align: center;
            }
            h1 {
                color : red
            }
            p {
                color: grey;
            }
            .cards {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 25px;
            }
            .planet-name {
                font-size: 22px;
                font-weight: bold;
                color: black;
            }
            button {
                background: red;
                color: white;
                border: none;
                padding: 12px 28px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>My Planet Cards</h1>
        <p>use a javascript class to build planet cards!</p>
        <button onclick="showPlanets()">show planets!</button>
        <div class="cards">
            <div id="card1"></div>
            <div id="card2"></div>
            <div id="card3"></div>
        </div>
        <script>
            class Planet {
                constructor(name, fact) {
                    this.name = name;
                    this.fact = fact;
                }
                describe() {
                    return this.name + ": " + this.fact;
                }
            }

            function showPlanets() {
                let p1 = new Planet("Earth", "The only planet with life");
                let p2 = new Planet("Mars", "Known as the Red planet");
                let p3 = new Planet("Saturn", "Has rings made up of diamonds");

                document.getElementById("card1").innerHTML = p1.describe()
                document.getElementById("card2").innerHTML = p2.describe()
                document.getElementById("card3").innerHTML = p3.describe()
            }
        </script>
    </body>
</html>
