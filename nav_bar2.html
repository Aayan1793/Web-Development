<html>
    <head>
        <title>Navbar2</title>
        <style>
            .topnav {
                overflow: hidden;
                background-color: black;
            }
            .topnav a {
                float: left;
                color: #1affa3;
                text-align: center;
                padding: 14px 16px;
                font-size: 17px;
                text-decoration: none;
                
            }
            .topnav a:hover {
                background-color: orange;
                color: black;
            }
            .topnav a:active {
                background-color: blue;
                color: black;
            }
        </style>
    </head>
    <body>
        <header>
            <nav class="topnav">
                <a class="active" href="#home">Creative Hub</a>
                <a href="#">Home</a>
                <a href="#">Courses</a>
                <a href="#">Projects</a>
                <a href="#">About_Us</a>
            </nav>
        </header>
        <main>
            <h1>Welcome to Creative Hub!!</h1>
            <p>Learn, create and explore now ideas!!</p>
        </main>
    </body>
</html>
