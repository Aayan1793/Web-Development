<html>
    <head>
        <title>Navbar</title>
        <style>
            body {
                margin: 0;
            }
            .topnav {
                overflow: hidden;
                background-color: black;
            }
            .topnav a {
                float: left;
                color: #1affa3;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover {
                background-color: grey;
                color: black;
            }
            .topnav a:active {
                background-color: yellow;
                color: black;
            }
        </style>
    </head>
    <body>
        <header>
            <nav class="topnav">
                <a class="active" href="#home">Brand</a>
                <a href="#">Home</a>
                <a href="#">About_Us</a>
                <a href="#">Gallery</a>
                <a href="#">Contact_Us</a>
            </nav>
        </header>
    </body>
</html>
