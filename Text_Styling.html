<html>
    <head>
        <title>My Superhero Card</title>
        <style>

            body {
                background-color: Darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            .hero-name{
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange
            }

            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
            }

            .label {
                text-transform: uppercase;
                text-decoration: underline wavy;
                color: coral;
            }

            .power {
                font-weight:bold;
                color: lightgreen;
            }

            .weakness {
                text-decoration: line-through;
                color: grey;
            }

            .badge {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }

            .made-by {
                color: coral;
                font-style: italic;
            }


        </style>
    </head>
    <body>
        <h1 class="hero-name">Thunder kid</h1>
        <p class="tagline">the most powerful hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">can run faster than a cheetah</p>
        <p class="power">can lift a school bus</p>

        <h2 class="label">weakness</h2>
        <p class="weakness">maths homework</p>
        <p class="weakness"> broccoli</p>

        <p class="badge">top hero</p>

        <p class="made-by"> Created by____________</p>
        
    </body>
</html>
