<html>
    <head>
        <title>To-do list</title>

        <style>
            body {
                background-color: rgb(180, 217, 230);
            }

            .container {
                background-color: white;
                width: 600px;
                padding: 40px;
                text-align: center;
                border-radius: 20px;
                box-shadow: 0 5px 15px;
                margin: auto;
            }

            button {
                background-color: blue;
                color: white;
                padding:15px 20px;
                border-radius: 8px;
            }

            input {
                width: 65%;
                padding: 15px;
                border-radius: 8px
            }
            ul {
                list-style: none;
            }
            li {
                background-color: rgb(233, 231, 231);
                padding: 15px;
                margin: 12px 0;
                border-radius: 8px
            }
            .delete {
                background-color:red;
                color:white;
                padding: 8px;
                border-radius: 6px;
            }
        </style>
        
    </head>

    <body>


        <div class="container">

            <h1> My To-Do List</h1>

            <form onsubmit="createItem(); return false;">
                <input type="text" id="myInput" placeholder="Enter A Task">
                <button type="submit">Add task</button>

            </form>

            <ul id="myList"></ul>

        </div>

        <script src="to_do_list.js"></script>
    </body>

</html>
