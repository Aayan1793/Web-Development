<html>
    <head>
        <title>Food Menu</title>
        <style>
            body {
                font-family: Arial;
                background: white;
                padding: 30px;
                text-align: center;
            }

            h1 {
                color: #e65c00;
            }

            h1 + p {
                background: #ffe0b2;
                padding: 10px 20px;
                border-radius: 8px;
                color: #bf360c;
                display: inline-block;
            }
             h1 ~ p {
                 border-radius: 8px;
                 color: gray
             }

            
            ul {
                padding: 0;
                margin-top: 20px;
            }

            ul > li {
                list-style: none;
                font-size: 18px;
                font-weight: bold;
                color: #5d4037;
                padding: 10px 20px;
                margin: 6px auto;
                width:v260px;
                background: white;
                border-radius: 8px;
            }

            ul li:nth-child(3) {
                background: #ffe082;
                color:#e65c00;
            }

            .desc {
                color: #555;
                margin-top: 20px;
                font-size: 15px;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }

            .desc::first-letter{
                font-size: 220%;
                color: #e65c00;
                font-weight: bold;
            }

            .links {
                margin-top: 25px
            }

            a {
                color: #e65c00;
                text-decoration: none;
                font-size: 15px;
                margin: 0 12px;
                padding: 8px 18px;
                border: 2px solid #e65c00;
                border-radius: 8px;
            }

            a:hover {
                background: #e65c00;
                color: white;
            }
        </style>
    </head>
    <body>
        <h1> My food menu</h1>
        <p>pick your faviorite dish and dig in!</p>


        <ul>
            <li>pizza</li>
            <li>burger</li>
            <li>Tacos--chefs special</li>
            <li>noodles</li>
            <li>ice cream</li>
        </ul>

        <p class="desc">Every dish on this menu is made with love and loads of flavor try them all and find your faviorite!!</p>


        <div class="links">
            <a href-#>order now</a>
            <a href="#">see more</a>
        </div>
    </body>
</html>
