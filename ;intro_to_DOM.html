<html>
    <head>
        <title>My Zoo</title>
        <style>

            body {
                text-align: center;
                padding: 30px
            }

            h1 {
                color :red;
            }

            .zone {
                border: 1px solid red;
                margin: 6px 0;
                padding: 8px 12px;
                border-radius:6px;
                text-align: left;
            }

            button {
                background: red;
                color: white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>

        <h1>My Zoo</h1>
        <div id="zoo">
            <div class="zone">Zone 1: <span id="zone1"></span></div>
            <div class="zone">Zone 2: <span id="zone2"></span></div>
            <div class="zone">Total Animals: <spam id="total"></spam></div>
        </div>

        <br>

        <button onclick="openZoo()">Open the Zoo!</button>

        <p id="zoo-status"></p>

        <script>

            function openZoo() {
            
                
                document.getElementById("zone1").innerHTML = "Lion";

                document.getElementById("zone2").innerHTML = "Elephant";

                document.getElementById("total").innerHTML = "2";

                document.getElementById("zoo").style.backgroundColor = "Lightgreen";

                document.getElementById("zoo-status").innerHTML = document.title + "is now open!";
            }
        </script>
    </body>

</html>
