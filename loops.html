
<html>
<head>
  <title>Methods and Loops</title>
</head>
<body>

  <h2>Methods and Loops</h2>

  <p>Numbers from 1 to 10</p>
  <p id="numbers"></p>

  <p id="random"></p>
  <p id="day"></p>

  <button onclick="showRandom()">Generate Random Number</button>
  <button onclick="showDay()">Show Today's Day</button>

  <script>
    // Part 1: Numbers from 1 to 10
    let text = "";

    for (let i = 1; i <= 10; i++) {
      text += i + "<br>";
    }

    document.getElementById("numbers").innerHTML = text;

    // Part 2: Random number
    function showRandom() {
      let random = Math.floor(Math.random() * 100);
      document.getElementById("random").innerHTML =
        "The random number is " + random;
    }

    // Part 3: Today's day number
    function showDay() {
      let day = new Date().getDay();
      document.getElementById("day").innerHTML =
        "Today's day number is " + day;
    }
  </script>

</body>
</html>
