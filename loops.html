<html>
    <body>
        <h2>JavaScript for loops</h2>
        <P id="demo"></P>
        <script>
            var text = "";
            for (var i = 1; i < 11; i++) {
                text = text + i + "<br>";
            }
            document.getElementById("demo").innerHTML = text;

        </script>
    </body>
</html>
