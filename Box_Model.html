<html>
    <head>
        <title>Box Model</title>
    </head>
    <style>
       body {
        background-color: rgb(14, 207, 14)
       }  
       
       .fact-file{
        background-color: white;
        width: 320px;
        border: 5px solid green;
        padding: 28px 32px;
        border-radius: 12px;
        text-align: left;
       }

       .animal-name {
        color: rgb(56, 207, 56);
        font-size: 30px;
        
       }

       .detail{
        
        font-weight: bold;
       }

       .cool-fact {
        color: orange;
        font-style: italic;
        font-weight: bold
       }
    </style>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">Type: Big Cat</p>
            <p class="detail">lives in: mountain ranges of central asia</p>
            <p class="detail">diet: deer, goats and wild sheep</p>
            <p class="cool-fact">cool fact: can leap upto 15 meters in one jump</p>  
        </div>

    </body>
</html>
