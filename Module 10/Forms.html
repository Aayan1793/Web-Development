        <h1>Doctors Appointment</h1>

                <label>Your name></label><br>

                <label>patient id</label><br>
                <input type="password" placeholder="your secret id"><br><br>

                <label>Date of birth</label><br>
                <input type="date"><br>

            </fieldset>

            <br>

            <fieldset>
                <legend>your visit</legend>

                <label>choose your doctor</label><br>

                    <option>Dr Ray---General</option>
                    <option>Dr Lee---Teeth</option>
                    <option>Dr Sam---Eyes</option>
                </select><br><br>
            </fieldset>
        </form>
    </body>
