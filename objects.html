<html>
    <head>
        <meta charset="UTF-8">
        <title>my phone contact</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet">
              <style>
                body { background-color: white; }
                h1 { color: red; }
                .card-label { font-size : 11px; color: grey; text-transform: uppercase; }
                pre { font-size: 13px; color: #333}
              </style>
    </head>
    <body class="py-4">

        <div class="container">

            <h1 class="mb-1"> my phone contacts</h1>
            <p class="text-muted mb-4">
                intro to objects
            </p>

            <div class="card-shadow-sm mb-3" style="max-width:400px;">
                <div class="card-body">
                    <h5 class="card-title" style="color: orange;">Contact details</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <span class="card-label d-block">name</span>
                            <strong id="name">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">phone</span>
                            <strong id="phone">-</strong>
                        </li>

                    </ul>
                </div>
            </div>
        </div>

        <script>

            var myContact = {
                name: "ahmed ali",
                phone: "0321-1234567",
            };

            var nameE1 = document.getElementById("name");
            var phoneE1 = document.getElementById("phone");
            nameE1.textContent = myContact.name;
            phoneE1.textContent = myContact['phone'];
        </script>
    </body>
</html>
